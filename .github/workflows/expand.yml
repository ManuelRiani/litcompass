# Optional: build a project's graph on GitHub Actions and commit the results.
# Only for a PRIVATE copy where the project folder is tracked (see docs/ARCHITECTURE.md §8).
name: expand graph

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project slug (folder under projects/)"
        required: true
      max_minutes:
        description: "Run duration (minutes)"
        default: "30"
  # Uncomment for a nightly run (also set the PROJECT repository variable):
  # schedule:
  #   - cron: "17 1 * * *"

permissions:
  contents: write

concurrency:
  group: litcompass-expand
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT: ${{ inputs.project || vars.PROJECT }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Expand
        run: python -m litcompass -p "$PROJECT" run --max-minutes "${{ inputs.max_minutes || '30' }}"
      - name: Commit results
        if: always()
        run: |
          git config user.name "litcompass-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "projects/$PROJECT/data" "projects/$PROJECT/reports" "projects/$PROJECT/exports"
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "graph: run of $(date -u +%Y-%m-%d) ($PROJECT)"
          git push
